trigger:
  batch: true
  branches:
    include:
      - main

pool:
  name: 'Estevia-Self-Hosted'

variables:
  - group: estevia-frontend-vars

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    API_BASE="${VITE_API_BASE:-https://api-evaops.esteviatech.com/api}"
    DEFAULT_DOMAIN="${VITE_DEFAULT_DOMAIN:-esteviatech.com}"
    DEVOPS_ORG_URL="${VITE_AZURE_DEVOPS_ORG_URL:-https://dev.azure.com/esteviatech}"
    echo "VITE_API_BASE=$API_BASE" > .env.production
    echo "VITE_DEFAULT_DOMAIN=$DEFAULT_DOMAIN" >> .env.production
    echo "VITE_AZURE_DEVOPS_ORG_URL=$DEVOPS_ORG_URL" >> .env.production
  displayName: 'Create production env file'

- script: |
    npm ci
    npm run build
  displayName: 'Install dependencies and build'

- task: AzureStaticWebApp@0
  inputs:
    app_location: '/'
    api_location: ''
    output_location: 'dist'
    azure_static_web_apps_api_token: $(EVAOPS_SWA_TOKEN_PROD)
  displayName: 'Deploy to Azure Static Web App'
